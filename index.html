<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Web 1</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        h2 {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h2::before {
            content: '●';
            color: #22c55e; /* Indicador de servidor activo */
            font-size: 0.8rem;
        }

        .info-card {
            background-color: #f1f5f9;
            padding: 1.25rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        p {
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        p strong {
            color: var(--primary-color);
        }

        .ip-badge {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Infraestructura Inform&aacute;tica para Centros de Procesamiento de Datos</h1>
        <h2>Servidor Web 1</h2>
        <div class="info-card">
            <p><strong>Estudiante:</strong> <span>Luis Mario Laesa</span></p>
            <p><strong>Direcci&oacute;n IP:</strong> <span class="ip-badge">192.168.10.3</span></p>
        </div>
    </div>
</body>
</html>
